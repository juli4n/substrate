    description: |
      Deleting an actor template with the wrong UID fails with ABORTED, and with
      the right UID but the wrong version fails with ABORTED; both leave it
      unchanged. With the right UID and version the delete succeeds.

  - name: DeleteActorTemplate_ValidationError
    resource: actortemplates
    description: |
      Deleting an actor template with an invalid name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  # ---------------------------------------------------------------------------
  # API wide
  # ---------------------------------------------------------------------------

  - name: RejectUnknownFields
    resource: api
    description: |
      A request carrying a field the server does not know fails with
      INVALID_ARGUMENT.

  # ---------------------------------------------------------------------------
  # Atespaces
  # ---------------------------------------------------------------------------

  - name: CreateAtespace
    resource: atespaces
    description: |
      Creates an atespace and verifies that the whole resource has the expected
      shape.

  - name: CreateAtespace_AlreadyExists
    resource: atespaces
    description: |
      Creating an atespace with the name of an existing one fails with
      ALREADY_EXISTS.

  - name: CreateAtespace_ValidationError
    resource: atespaces
    description: |
      Creating an atespace with an invalid name fails with INVALID_ARGUMENT.

  - name: CreateAtespace_Authorization
    resource: atespaces
    description: |
      Creating an atespace as a principal no access policy names fails with
      PERMISSION_DENIED. Granted the viewer role by the global access policy,
      the principal still fails with PERMISSION_DENIED. In both cases no
      atespace is created: getting it fails with NOT_FOUND. Granted the owner
      role instead, the principal eventually creates the atespace (OK).

  - name: GetAtespace
    resource: atespaces
    description: |
      Getting an existing atespace returns exactly the resource CreateAtespace
      returned.

  - name: GetAtespace_NotFound
    resource: atespaces
    description: |
      Getting an atespace that doesn't exist fails with NOT_FOUND.

  - name: GetAtespace_ValidationError
    resource: atespaces
    description: |
      Getting an atespace with an invalid name fails with INVALID_ARGUMENT and
      the error names the invalid field.

  - name: GetAtespace_Authorization
    resource: atespaces
    description: |
      Getting an atespace as a principal no access policy names fails with
      PERMISSION_DENIED, both for an atespace that exists and for one that does
      not. Granted the viewer role, then the editor role, then the owner role,
      by the atespace's access policy, the principal eventually gets the
      atespace (OK) each time.

  - name: GetAtespace_AtespaceRecreated
    resource: atespaces
    description: |
      A principal granted the viewer role by an atespace's access policy
      eventually gets the atespace (OK). After the admin deletes the atespace
      and creates it again under the same name, getting it as the principal
      eventually fails with PERMISSION_DENIED, and the new atespace has no
      access policy: getting the policy fails with NOT_FOUND.

  - name: ListAtespaces
    resource: atespaces
    description: |
      Creates N atespaces and lists them with pages smaller than N.

  - name: ListAtespaces_ValidationError
    resource: atespaces
    description: |
      Listing atespaces with a negative page size fails with INVALID_ARGUMENT
      and the error names the invalid field.

  - name: ListAtespaces_InvalidPageToken
    resource: atespaces
    description: |
      Listing atespaces with a malformed page token fails with INVALID_ARGUMENT.

  - name: ListAtespaces_Authorization
    resource: atespaces
    description: |
      Listing atespaces as a principal no access policy names fails with
      PERMISSION_DENIED. Granted the viewer role, then the owner role, by the
      global access policy, the principal eventually lists atespaces (OK) each
      time.

  - name: DeleteAtespace
    resource: atespaces
    description: |
      Deletes an empty atespace. The response is the deleted atespace, and a
      later Get fails with NOT_FOUND.

  - name: DeleteAtespace_NotFound
    resource: atespaces
    description: |
      Deleting an atespace that doesn't exist fails with NOT_FOUND.

  - name: DeleteAtespace_WithPreconditions
    resource: atespaces
    description: |
      Deleting an atespace with the wrong UID fails with ABORTED, and with the
      right UID but the wrong version fails with ABORTED. With the right UID and
      version the delete succeeds, and deleting it again fails with NOT_FOUND.

  - name: DeleteAtespace_HasChildren
    resource: atespaces
    description: |
      Deleting an atespace that holds an actor template fails with
      FAILED_PRECONDITION.

  - name: DeleteAtespace_ValidationError
    resource: atespaces
    description: |
      Deleting an atespace with an invalid name fails with INVALID_ARGUMENT and
      the error names the invalid field.

  - name: DeleteAtespace_Authorization
    resource: atespaces
    description: |
      Deleting an atespace as a principal no access policy names fails with
      PERMISSION_DENIED, both for an atespace that exists and for one that does
      not. Granted the viewer role, then the editor role, by the atespace's
      access policy, the principal still fails with PERMISSION_DENIED, and the
      atespace is unchanged. Granted the owner role instead, the principal
      eventually deletes the atespace (OK).

  # ---------------------------------------------------------------------------
  # Actor egress policies
  # ---------------------------------------------------------------------------

  - name: CreateActorEgressPolicy
    resource: egresspolicies
    description: |
      Creates an egress policy for an existing actor and verifies that the whole
      resource has the expected shape.

  - name: CreateActorEgressPolicy_AlreadyExists
    resource: egresspolicies
    description: |
      Creating an egress policy for an existing actor name fails with
      ALREADY_EXISTS and leaves the existing one unchanged.

  - name: CreateActorEgressPolicy_ValidationError
    resource: egresspolicies
    description: |
      Creating an egress policy with an invalid actor name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: CreateActorEgressPolicy_ActorNotFound
    resource: egresspolicies
    description: |
      Creating an egress policy for an actor that doesn't exist fails with
      FAILED_PRECONDITION.

  - name: GetActorEgressPolicy
    resource: egresspolicies
    description: |
      Getting an existing egress policy returns exactly the resource
      CreateActorEgressPolicy returned.

  - name: GetActorEgressPolicy_NotFound
    resource: egresspolicies
    description: |
      Getting an egress policy that doesn't exist fails with NOT_FOUND.

  - name: GetActorEgressPolicy_ValidationError
    resource: egresspolicies
    description: |
      Getting an egress policy with an invalid actor name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: GetActorEgressPolicy_ActorDeleted
    resource: egresspolicies
    description: |
      After an actor with an egress policy is deleted, getting its egress policy
      fails with NOT_FOUND. An actor created again under the same name has no
      egress policy either: getting it fails with NOT_FOUND.

  - name: UpdateActorEgressPolicy
    resource: egresspolicies
    description: |
      Updates the rules of an existing egress policy, sending it as read. The
      result, and a later Get, is the resource as read with that field changed
      and a higher version.

  - name: UpdateActorEgressPolicy_NotFound
    resource: egresspolicies
    description: |
      Updating an egress policy that doesn't exist fails with NOT_FOUND.

  - name: UpdateActorEgressPolicy_WithPreconditions
    resource: egresspolicies
    description: |
      Updating an egress policy with the wrong UID fails with ABORTED, and with
      the right UID but the wrong version fails with ABORTED; both leave it
      unchanged. Updating it without a UID or a version fails with
      INVALID_ARGUMENT.

  - name: UpdateActorEgressPolicy_ValidationError
    resource: egresspolicies
    description: |
      Updating an egress policy with an invalid actor name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: DeleteActorEgressPolicy
    resource: egresspolicies
    description: |
      Deletes an existing egress policy. The response is the deleted resource,
      and a later Get fails with NOT_FOUND.

  - name: DeleteActorEgressPolicy_NotFound
    resource: egresspolicies
    description: |
      Deleting an egress policy that doesn't exist fails with NOT_FOUND.

  - name: DeleteActorEgressPolicy_WithPreconditions
    resource: egresspolicies
    description: |
      Deleting an egress policy with the wrong UID fails with ABORTED, and with
      the right UID but the wrong version fails with ABORTED; both leave it
      unchanged. With the right UID and version the delete succeeds.

  - name: DeleteActorEgressPolicy_ValidationError
    resource: egresspolicies
    description: |
      Deleting an egress policy with an invalid actor name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  # ---------------------------------------------------------------------------
  # Tags
  # ---------------------------------------------------------------------------

  - name: CreateTag
    resource: tags
    description: |
      Creates a tag from a suspended actor and verifies that the whole resource
      has the expected shape.

  - name: CreateTag_AlreadyExists
    resource: tags
    description: |
      Creating a tag for an existing name fails with ALREADY_EXISTS and leaves
      the existing one unchanged.

  - name: CreateTag_ValidationError
    resource: tags
    description: |
      Creating a tag with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  # TODO(): If the source actor is not found, we should return
  # FAILED_PRECONDITION instead of NOT_FOUND.
  - name: CreateTag_SourceActorNotFound
    resource: tags
    description: |
      Creating a tag from a source actor that doesn't exist fails with
      NOT_FOUND, and no tag is created.

  - name: GetTag
    resource: tags
    description: |
      Getting an existing tag returns exactly the resource CreateTag returned.

  - name: GetTag_NotFound
    resource: tags
    description: |
      Getting a tag that doesn't exist fails with NOT_FOUND.

  - name: GetTag_ValidationError
    resource: tags
    description: |
      Getting a tag with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: ListTags
    resource: tags
    description: |
      Creates N tags in one atespace and one in another, then lists the first
      atespace with pages smaller than N. The pages together hold exactly its N
      tags.

  - name: ListTags_ValidationError
    resource: tags
    description: |
      Listing tags with a negative page size fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: ListTags_InvalidPageToken
    resource: tags
    description: |
      Listing tags with a malformed page token fails with INVALID_ARGUMENT.

  - name: ListTags_AtespaceNotFound
    resource: tags
    description: |
      Listing tags in an atespace that doesn't exist succeeds with an empty
      list.

  - name: UpdateTag
    resource: tags
    description: |
      Updates the scope of an existing tag, sending it as read. The result, and
      a later Get, is the resource as read with that field changed and a higher
      version.

  - name: UpdateTag_NotFound
    resource: tags
    description: |
      Updating a tag that doesn't exist fails with NOT_FOUND.

  - name: UpdateTag_WithPreconditions
    resource: tags
    description: |
      Updating a tag with the wrong UID fails with ABORTED, and with the right
      UID but the wrong version fails with ABORTED; both leave it unchanged.
      Updating it without a UID or a version fails with INVALID_ARGUMENT.

  - name: UpdateTag_ValidationError
    resource: tags
    description: |
      Updating a tag with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: DeleteTag
    resource: tags
    description: |
      Deletes an existing tag. The response is the deleted resource, and a later
      Get fails with NOT_FOUND.

  - name: DeleteTag_NotFound
    resource: tags
    description: |
      Deleting a tag that doesn't exist fails with NOT_FOUND.

  - name: DeleteTag_WithPreconditions
    resource: tags
    description: |
      Deleting a tag with the wrong UID fails with ABORTED, and with the right
      UID but the wrong version fails with ABORTED; both leave it unchanged.
      With the right UID and version the delete succeeds.

  - name: DeleteTag_ValidationError
    resource: tags
    description: |
      Deleting a tag with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  # ---------------------------------------------------------------------------
  # Workers
  # ---------------------------------------------------------------------------

  - name: CreateWorker
    resource: workers
    description: |
      Creates a worker and verifies that the whole resource has the expected
      shape.

  - name: CreateWorker_AlreadyExists
    resource: workers
    description: |
      Creating a worker for an existing name fails with ALREADY_EXISTS and
      leaves the existing one unchanged.

  - name: CreateWorker_ValidationError
    resource: workers
    description: |
      Creating a worker with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: GetWorker
    resource: workers
    description: |
      Getting an existing worker returns exactly the resource CreateWorker
      returned.

  - name: GetWorker_NotFound
    resource: workers
    description: |
      Getting a worker that doesn't exist fails with NOT_FOUND.

  - name: GetWorker_ValidationError
    resource: workers
    description: |
      Getting a worker with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: ListWorkers
    resource: workers
    description: |
      Creates N workers and lists them with pages smaller than N. The pages
      together hold exactly the N workers.

  - name: ListWorkers_ValidationError
    resource: workers
    description: |
      Listing workers with a negative page size fails with INVALID_ARGUMENT and
      the error names the invalid field.

  - name: ListWorkers_InvalidPageToken
    resource: workers
    description: |
      Listing workers with a malformed page token fails with INVALID_ARGUMENT.

  - name: UpdateWorker
    resource: workers
    description: |
      Updates the labels of an existing worker, sending it as read. The result,
      and a later Get, is the resource as read with that field changed and a
      higher version.

  - name: UpdateWorker_NotFound
    resource: workers
    description: |
      Updating a worker that doesn't exist fails with NOT_FOUND.

  - name: UpdateWorker_WithPreconditions
    resource: workers
    description: |
      Updating a worker with the wrong UID fails with ABORTED, and with the
      right UID but the wrong version fails with ABORTED; both leave it
      unchanged. Updating it without a UID or a version fails with
      INVALID_ARGUMENT.

  - name: UpdateWorker_ValidationError
    resource: workers
    description: |
      Updating a worker with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: UpdateWorker_ImmutableField
    resource: workers
    description: |
      Updating a worker's node name, sending it as read with only that field
      changed, fails with INVALID_ARGUMENT and leaves the worker unchanged.

  - name: DeleteWorker
    resource: workers
    description: |
      Deletes an existing worker. The response is the worker as read before the
      delete, marked DRAINING, and a later Get fails with NOT_FOUND.

  - name: DeleteWorker_NotFound
    resource: workers
    description: |
      Deleting a worker that doesn't exist fails with NOT_FOUND.

  - name: DeleteWorker_WithPreconditions
    resource: workers
    description: |
      Deleting a worker with the wrong UID fails with ABORTED, and with the
      right UID but the wrong version fails with ABORTED; both leave it
      unchanged. With the right UID and version the delete succeeds.

  - name: DeleteWorker_ValidationError
    resource: workers
    description: |
      Deleting a worker with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: DeleteWorker_HostingActor
    resource: workers
    description: |
      Deleting a worker that hosts a running actor succeeds (OK), and a later
      Get of the worker fails with NOT_FOUND. The actor becomes CRASHED, with no
      worker assignment and a crash message saying the worker pod went away
      while hosting the actor.

  - name: DrainWorker
    resource: workers
    description: |
      Draining an active worker marks it DRAINING. The result, and a later Get,
      is the worker as read with that state and a higher version.

  - name: DrainWorker_NotFound
    resource: workers
    description: |
      Draining a worker that doesn't exist fails with NOT_FOUND.

  - name: DrainWorker_ValidationError
    resource: workers
    description: |
      Draining a worker with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: DrainWorker_AlreadyDraining
    resource: workers
    description: |
      Draining a worker that is already DRAINING succeeds (OK). The response,
      and a later Get, is the worker exactly as it was, its version included.

  - name: ListWorkerActorAssignments
    resource: workers
    description: |
      Lists the assignments of a worker hosting N running actors with pages
      smaller than N. The pages together hold exactly one assignment per actor.

  - name: ListWorkerActorAssignments_NotFound
    resource: workers
    description: |
      Listing the assignments of a worker that doesn't exist fails with
      NOT_FOUND.

  - name: ListWorkerActorAssignments_ValidationError
    resource: workers
    description: |
      Listing the assignments of a worker with a negative page size fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: ListWorkerActorAssignments_InvalidPageToken
    resource: workers
    description: |
      Listing the assignments of a worker with a malformed page token fails with
      INVALID_ARGUMENT.

  - name: SetWorkerCapacity
    resource: workers
    description: |
      Reports, as the worker's node's atelet, room for 3 actors, 2 CPUs and 4Gi
      of memory. The response, and a later Get, is the worker as read with that
      capacity and a higher version. A second report, with room for 3 actors and
      no resources, replaces the capacity: the worker no longer has CPU or
      memory capacity.

  - name: SetWorkerCapacity_NotFound
    resource: workers
    description: |
      Reporting, as a node's atelet, the capacity of a worker that doesn't exist
      fails with NOT_FOUND.

  - name: SetWorkerCapacity_ValidationError
    resource: workers
    description: |
      Reporting, as a node's atelet, the capacity of a worker with an invalid
      name fails with INVALID_ARGUMENT and the error names the invalid field.

  - name: SetWorkerCapacity_Unchanged
    resource: workers
    description: |
      Reporting, as the worker's node's atelet, the capacity the worker already
      has succeeds (OK) and leaves the worker unchanged, its version included.

  - name: SetWorkerCapacity_OtherNode
    resource: workers
    description: |
      Reporting the capacity of a worker as the atelet of a different node fails
      with NOT_FOUND, as if the worker did not exist, and leaves the worker
      unchanged.
