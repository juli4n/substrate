tests:
  # ---------------------------------------------------------------------------
  # Access policies
  # ---------------------------------------------------------------------------

  - name: CreateAtespaceAccessPolicy
    resource: accesspolicies
    description: |
      Creates an access policy for an existing atespace and verifies that the
      whole resource has the expected shape.

  - name: CreateAtespaceAccessPolicy_AlreadyExists
    resource: accesspolicies
    description: |
      Creating an access policy for an atespace that has one fails with
      ALREADY_EXISTS and leaves the existing one unchanged.

  - name: CreateAtespaceAccessPolicy_ValidationError
    resource: accesspolicies
    description: |
      Creating an access policy with an invalid atespace name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: CreateAtespaceAccessPolicy_AtespaceNotFound
    resource: accesspolicies
    description: |
      Creating an access policy for an atespace that doesn't exist fails with
      FAILED_PRECONDITION.

  - name: CreateAtespaceAccessPolicy_Authorization
    resource: accesspolicies
    description: |
      Creating an atespace's access policy as a principal no access policy names
      fails with PERMISSION_DENIED, both for an atespace that exists and for one
      that does not, and no policy is created: getting it fails with NOT_FOUND.
      Once the admin creates the atespace's policy, granting the principal the
      viewer role, then the editor role, the principal still fails with
      PERMISSION_DENIED. Granted the owner role, the principal is eventually
      allowed, and fails with ALREADY_EXISTS because the policy exists.

  - name: GetAtespaceAccessPolicy
    resource: accesspolicies
    description: |
      Getting an existing access policy returns exactly the resource
      CreateAtespaceAccessPolicy returned.

  - name: GetAtespaceAccessPolicy_NotFound
    resource: accesspolicies
    description: |
      Getting the access policy of an atespace that has none fails with
      NOT_FOUND.

  - name: GetAtespaceAccessPolicy_ValidationError
    resource: accesspolicies
    description: |
      Getting an access policy with an invalid atespace name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: GetAtespaceAccessPolicy_AtespaceDeleted
    resource: accesspolicies
    description: |
      After an atespace with an access policy is deleted, getting its access
      policy fails with NOT_FOUND. An atespace created again under the same name
      has no access policy either: getting it fails with NOT_FOUND.

  - name: GetAtespaceAccessPolicy_Authorization
    resource: accesspolicies
    description: |
      Getting an atespace's access policy as a principal it does not name fails
      with PERMISSION_DENIED, as does getting the access policy of an atespace
      that does not exist. Granted the viewer role, then the editor role, then
      the owner role, by that policy, the principal eventually gets it (OK) each
      time.

  - name: UpdateAtespaceAccessPolicy
    resource: accesspolicies
    description: |
      Updates the bindings of an existing access policy, sending it as read. The
      result, and a later Get, is the resource as read with that field changed
      and a higher version.

  - name: UpdateAtespaceAccessPolicy_NotFound
    resource: accesspolicies
    description: |
      Updating the access policy of an atespace that has none fails with
      NOT_FOUND.

  - name: UpdateAtespaceAccessPolicy_WithPreconditions
    resource: accesspolicies
    description: |
      Updating an access policy with the wrong UID fails with ABORTED, and with
      the right UID but the wrong version fails with ABORTED; both leave it
      unchanged. Updating it without a UID or a version fails with
      INVALID_ARGUMENT.

  - name: UpdateAtespaceAccessPolicy_ValidationError
    resource: accesspolicies
    description: |
      Updating an access policy with an invalid atespace name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: UpdateAtespaceAccessPolicy_Authorization
    resource: accesspolicies
    description: |
      Updating an atespace's access policy as a principal it does not name fails
      with PERMISSION_DENIED, as does updating the access policy of an atespace
      that does not exist. Granted the viewer role, then the editor role, by
      that policy, the principal still fails with PERMISSION_DENIED. Each
      refused update leaves the policy unchanged. Granted the owner role, the
      principal eventually updates it (OK).

  - name: UpdateAtespaceAccessPolicy_RevokesAccess
    resource: accesspolicies
    description: |
      A principal granted the viewer role by an atespace's access policy
      eventually gets the atespace (OK). After the admin updates the policy to
      no longer name the principal, getting the atespace eventually fails with
      PERMISSION_DENIED.

  - name: UpdateAtespaceAccessPolicy_DowngradesAccess
    resource: accesspolicies
    description: |
      A principal granted the owner role by an atespace's access policy
      eventually updates that policy (OK). After the admin changes the
      principal's binding to the viewer role, deleting the atespace eventually
      fails with PERMISSION_DENIED and leaves it unchanged, while getting it
      still succeeds (OK).

  - name: UpdateAtespaceAccessPolicy_ManyMembers
    resource: accesspolicies
    description: |
      An atespace's access policy grants the viewer role to 250 principals, and
      each of them eventually gets the atespace (OK). After the admin updates
      the policy to name only the first of them, the first still gets the
      atespace (OK), and each of the other 249 eventually fails with
      PERMISSION_DENIED.

  - name: DeleteAtespaceAccessPolicy
    resource: accesspolicies
    description: |
      Deletes an existing access policy. The response is the deleted resource,
      and a later Get fails with NOT_FOUND.

  - name: DeleteAtespaceAccessPolicy_NotFound
    resource: accesspolicies
    description: |
      Deleting the access policy of an atespace that has none fails with
      NOT_FOUND.

  - name: DeleteAtespaceAccessPolicy_WithPreconditions
    resource: accesspolicies
    description: |
      Deleting an access policy with the wrong UID fails with ABORTED, and with
      the right UID but the wrong version fails with ABORTED; both leave it
      unchanged. With the right UID and version the delete succeeds.

  - name: DeleteAtespaceAccessPolicy_ValidationError
    resource: accesspolicies
    description: |
      Deleting an access policy with an invalid atespace name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: DeleteAtespaceAccessPolicy_Authorization
    resource: accesspolicies
    description: |
      Deleting an atespace's access policy as a principal it does not name fails
      with PERMISSION_DENIED, as does deleting the access policy of an atespace
      that does not exist. Granted the viewer role, then the editor role, by
      that policy, the principal still fails with PERMISSION_DENIED. Each
      refused delete leaves the policy unchanged. Granted the owner role, the
      principal eventually deletes it (OK).

  - name: DeleteAtespaceAccessPolicy_RevokesAccess
    resource: accesspolicies
    description: |
      A principal granted the viewer role by an atespace's access policy
      eventually gets the atespace (OK). After the admin deletes the policy,
      getting the atespace eventually fails with PERMISSION_DENIED.

  - name: CreateGlobalAccessPolicy
    resource: accesspolicies
    description: |
      Creates the global access policy and verifies that the whole resource has
      the expected shape.

  - name: CreateGlobalAccessPolicy_AlreadyExists
    resource: accesspolicies
    description: |
      Creating the global access policy when it exists fails with ALREADY_EXISTS
      and leaves the existing one unchanged.

  - name: CreateGlobalAccessPolicy_ValidationError
    resource: accesspolicies
    description: |
      Creating the global access policy with a name other than "default" fails
      with INVALID_ARGUMENT and the error names the invalid field.

  - name: CreateGlobalAccessPolicy_Authorization
    resource: accesspolicies
    description: |
      Creating the global access policy as a principal no access policy names
      fails with PERMISSION_DENIED, and no policy is created: getting it fails
      with NOT_FOUND. Once the admin creates the global policy, granting the
      principal the viewer role, the principal still fails with
      PERMISSION_DENIED. Granted the owner role, the principal is eventually
      allowed, and fails with ALREADY_EXISTS because the policy exists.

  - name: GetGlobalAccessPolicy
    resource: accesspolicies
    description: |
      Getting the global access policy returns exactly the resource
      CreateGlobalAccessPolicy returned.

  - name: GetGlobalAccessPolicy_NotFound
    resource: accesspolicies
    description: |
      Getting the global access policy before it is created fails with
      NOT_FOUND.

  - name: GetGlobalAccessPolicy_Authorization
    resource: accesspolicies
    description: |
      Getting the global access policy as a principal no access policy names
      fails with PERMISSION_DENIED, both before the policy exists and after the
      admin creates it without naming the principal. Granted the viewer role,
      then the owner role, by that policy, the principal eventually gets it (OK)
      each time.

  - name: UpdateGlobalAccessPolicy
    resource: accesspolicies
    description: |
      Updates the bindings of the global access policy, sending it as read. The
      result, and a later Get, is the resource as read with that field changed
      and a higher version.

  - name: UpdateGlobalAccessPolicy_NotFound
    resource: accesspolicies
    description: |
      Updating the global access policy before it is created fails with
      NOT_FOUND.

  - name: UpdateGlobalAccessPolicy_WithPreconditions
    resource: accesspolicies
    description: |
      Updating the global access policy with the wrong UID fails with ABORTED,
      and with the right UID but the wrong version fails with ABORTED; both
      leave it unchanged. Updating it without a UID or a version fails with
      INVALID_ARGUMENT.

  - name: UpdateGlobalAccessPolicy_ValidationError
    resource: accesspolicies
    description: |
      Updating the global access policy with a name other than "default" fails
      with INVALID_ARGUMENT and the error names the invalid field.

  - name: UpdateGlobalAccessPolicy_Authorization
    resource: accesspolicies
    description: |
      Updating the global access policy as a principal no access policy names
      fails with PERMISSION_DENIED, both before the policy exists and after the
      admin creates it without naming the principal. Granted the viewer role by
      that policy, the principal still fails with PERMISSION_DENIED. Each
      refused update leaves the policy unchanged. Granted the owner role, the
      principal eventually updates it (OK).

  - name: UpdateGlobalAccessPolicy_RevokesInheritedAccess
    resource: accesspolicies
    description: |
      A principal granted the viewer role by the global access policy eventually
      gets an atespace that has no access policy of its own (OK). After the
      admin updates the global policy to no longer name the principal, getting
      the atespace eventually fails with PERMISSION_DENIED.

  # ---------------------------------------------------------------------------
  # Actors
  # ---------------------------------------------------------------------------

  - name: CreateActor
    resource: actors
    description: |
      Creates an actor and verifies that the whole resource has the expected
      shape.

  - name: CreateActor_AlreadyExists
    resource: actors
    description: |
      Creating an actor with the name of an existing one fails with
      ALREADY_EXISTS.

  - name: CreateActor_ValidationError
    resource: actors
    description: |
      Creating an actor with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: CreateActor_TemplateNotFound
    resource: actors
    description: |
      Creating an actor that references an actor template that doesn't exist
      fails with FAILED_PRECONDITION.

  - name: CreateActor_StorageClassNotFound
    resource: actors
    description: |
      Creating an actor with an external volume whose storage class doesn't
      exist fails with FAILED_PRECONDITION.

  - name: CreateActor_AtespaceNotFound
    resource: actors
    description: |
      Creating an actor in an atespace that doesn't exist fails with
      FAILED_PRECONDITION.

  # TODO(): If a tag is not found, we should return FAILED_PRECONDITION instead
  # of NOT_FOUND.
  - name: CreateActor_TagNotFound
    resource: actors
    description: |
      Creating an actor that references a tag that doesn't exist fails with
      NOT_FOUND.

  - name: GetActor
    resource: actors
    description: |
      Getting an existing actor returns exactly the resource CreateActor
      returned.

  - name: GetActor_NotFound
    resource: actors
    description: |
      Getting an actor that doesn't exist fails with NOT_FOUND.

  - name: GetActor_ValidationError
    resource: actors
    description: |
      Getting an actor with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: ListActors
    resource: actors
    description: |
      Creates N actors in one atespace and one in another, then lists the first
      atespace with pages smaller than N. The pages together hold exactly its N
      actors.

  - name: ListActors_ValidationError
    resource: actors
    description: |
      Listing actors with a negative page size fails with INVALID_ARGUMENT and
      the error names the invalid field.

  - name: ListActors_InvalidPageToken
    resource: actors
    description: |
      Listing actors with a malformed page token fails with INVALID_ARGUMENT.

  - name: ListActors_AtespaceNotFound
    resource: actors
    description: |
      Listing actors in an atespace that doesn't exist succeeds with an empty
      list.

  - name: UpdateActor
    resource: actors
    description: |
      Updates the worker selector of an existing actor, sending it as read. The
      result, and a later Get, is the resource as read with that field changed
      and a higher version.

  - name: UpdateActor_NotFound
    resource: actors
    description: |
      Updating an actor that doesn't exist fails with NOT_FOUND.

  - name: UpdateActor_WithPreconditions
    resource: actors
    description: |
      Updating an actor with the wrong UID fails with ABORTED, and with the
      right UID but the wrong version fails with ABORTED; both leave it
      unchanged. Updating it without a UID or a version fails with
      INVALID_ARGUMENT.

  - name: UpdateActor_ValidationError
    resource: actors
    description: |
      Updating an actor with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: DeleteActor
    resource: actors
    description: |
      Deletes a suspended actor. The response is the actor as read before the
      delete, marked DELETING, and a later Get fails with NOT_FOUND.

  - name: DeleteActor_NotFound
    resource: actors
    description: |
      Deleting an actor that doesn't exist fails with NOT_FOUND.

  - name: DeleteActor_WithPreconditions
    resource: actors
    description: |
      Deleting an actor with the wrong UID fails with ABORTED, and with the
      right UID but the wrong version fails with ABORTED; both leave it
      unchanged. With the right UID and version the delete succeeds.

  - name: DeleteActor_ValidationError
    resource: actors
    description: |
      Deleting an actor with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: ResumeActor
    resource: actors
    description: |
      Resumes a new actor on a pool with one worker on node a, and an unrelated
      worker on node b. The response says it resumed and matches GetActor. The
      actor becomes RUNNING with a worker assignment to the node a worker and is
      otherwise unchanged. That worker's allocation goes to one actor, with one
      assignment for this actor. The node a atelet received exactly one Restore,
      from the template's golden snapshot, and runs exactly this actor's
      sandbox. Node b's atelet received no calls, and object storage is
      unchanged.

  - name: ResumeActor_NotFound
    resource: actors
    description: |
      Resuming an actor that doesn't exist fails with NOT_FOUND.

  - name: ResumeActor_ValidationError
    resource: actors
    description: |
      Resuming an actor with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: ResumeActor_RestoreFails
    resource: actors
    description: |
      Resumes a new actor while the atelet fails the Restore with INTERNAL. The
      request fails with INTERNAL, and the actor becomes CRASHED with no worker
      assignment. Its status.crash is set: a message naming the atelet Restore
      and the atelet's error, and a crash time. It is otherwise unchanged. The
      worker is left with no allocation and no assignments, and the atelet runs
      no sandbox.

  - name: ResumeActor_RestoreUnavailable
    resource: actors
    description: |
      Resumes a new actor while the atelet fails the Restore with UNAVAILABLE.
      The request fails with UNAVAILABLE, and the actor stays RESUMING with its
      worker assignment, so a later resume can retry. The worker keeps its
      allocation of one actor and its assignment for this actor, and the atelet
      runs no sandbox.

  - name: ResumeActor_WrongState
    resource: actors
    description: |
      Resuming a crashed actor fails with FAILED_PRECONDITION and leaves the
      actor unchanged.

  - name: ResumeActor_AlreadyRunning
    resource: actors
    description: |
      Resuming a running actor succeeds (OK) and reports that it did not resume
      it. The actor is unchanged and the atelet receives no call.

  - name: ResumeActor_FromSuspended
    resource: actors
    description: |
      Resumes an actor that was suspended. The request succeeds (OK), the actor
      becomes RUNNING, and the atelet receives a Restore of the actor's own
      external snapshot, not the golden one.

  - name: ResumeActor_FromPaused
    resource: actors
    description: |
      Resumes a paused actor. The request succeeds (OK), the actor becomes
      RUNNING on a worker of the node that paused it, and that node's atelet
      receives a Restore of the actor's local snapshot.

  - name: ResumeActor_WorkerFull
    resource: actors
    description: |
      Resuming an actor while the pool's only worker hosts another actor fails
      with RESOURCE_EXHAUSTED, leaves the actor unchanged, and makes no atelet
      call. After the other actor is suspended, resuming succeeds (OK) on that
      worker.

  - name: ResumeActor_WorkerDraining
    resource: actors
    description: |
      Resuming an actor while the pool's only worker is draining fails with
      RESOURCE_EXHAUSTED, leaves the actor and the draining worker unchanged,
      and makes no atelet call. After a new worker is added, resuming succeeds
      (OK) on the new worker.

  - name: ResumeActor_WorkerRemoved
    resource: actors
    description: |
      Resuming an actor after the pool's only worker was removed fails with
      RESOURCE_EXHAUSTED, leaves the actor unchanged, and makes no atelet call.
      After a new worker is added, resuming succeeds (OK) on the new worker.

  - name: ResumeActor_Retry
    resource: actors
    description: |
      An actor left RESUMING by a Restore that failed with UNAVAILABLE is
      resumed again. The request succeeds (OK), the actor becomes RUNNING on the
      same worker, and that worker still holds exactly one assignment, for this
      actor.

  # TODO(): The request should fail with INTERNAL, as other resumes that crash
  # the actor do. ABORTED makes callers like the atenet router retry a resume
  # that cannot succeed.
  - name: ResumeActor_RetryWorkerDrained
    resource: actors
    description: |
      An actor left RESUMING by a Restore that failed with UNAVAILABLE has its
      worker drained, and is resumed again. The request fails with ABORTED, and
      the actor becomes CRASHED with no worker assignment and a crash message
      saying its worker is draining.

  - name: ResumeActor_RetryWorkerRemoved
    resource: actors
    description: |
      An actor left RESUMING by a Restore that failed with UNAVAILABLE has its
      worker removed. Removing the worker crashes the actor, with no worker
      assignment and a crash message saying the worker pod went away, and
      resuming it again fails with FAILED_PRECONDITION.

  # TODO(): The request should fail with INTERNAL, as other resumes that crash
  # the actor do. ABORTED makes callers like the atenet router retry a resume
  # that cannot succeed.
  - name: ResumeActor_RetryWorkerIneligible
    resource: actors
    description: |
      An actor left RESUMING by a Restore that failed with UNAVAILABLE has its
      worker relabeled so it no longer matches the template, and is resumed
      again. The request fails with ABORTED, the actor becomes CRASHED with no
      worker assignment and a crash message saying the worker no longer
      satisfies its placement constraints, and the worker is released.

  - name: ResumeActor_WithVolume
    resource: actors
    description: |
      Resumes an actor whose template has an external volume. The request
      succeeds (OK), the actor's volume is CREATED, and the volume plugin holds
      that volume attached to the worker's node.

  # TODO(): The request should fail with UNAVAILABLE when the volume plugin is
  # unavailable, so callers like the atenet router retry it.
  - name: ResumeActor_VolumeCreateFails
    resource: actors
    description: |
      Resumes an actor whose template has an external volume while the volume
      plugin fails CreateVolume. The request fails with INTERNAL and the actor
      stays SUSPENDED. A later resume creates and attaches the volume and
      succeeds (OK).

  # TODO(): The request should fail with UNAVAILABLE when the volume plugin is
  # unavailable, so callers like the atenet router retry it.
  - name: ResumeActor_VolumeAttachFails
    resource: actors
    description: |
      Resumes an actor whose template has an external volume while the volume
      plugin fails AttachVolume once. The request fails with INTERNAL and the
      actor stays RESUMING with its worker. A later resume attaches the volume
      and succeeds (OK).

  - name: ResumeActor_WithResourceLimits
    resource: actors
    description: |
      Resumes an actor whose template limits it to 500m of CPU and 1Gi of
      memory, on a worker reporting room for them. The request succeeds (OK),
      the atelet's Restore carries those limits, and the worker's allocation
      includes them.

  - name: ResumeActor_Concurrent
    resource: actors
    description: |
      Resumes an actor while a first resume of it is held at the atelet's
      Restore. The second request fails with ABORTED. Once the first is released
      it succeeds (OK), and the node runs exactly one sandbox for the actor.

  - name: ResumeActor_GoldenSnapshotMissing
    resource: actors
    description: |
      Resumes a new actor after its template's golden snapshot was deleted from
      object storage. The request fails with INTERNAL, and the actor becomes
      CRASHED with a crash message naming the atelet Restore.

  - name: SuspendActor_NotFound
    resource: actors
    description: |
      Suspending an actor that doesn't exist fails with NOT_FOUND.

  - name: SuspendActor_ValidationError
    resource: actors
    description: |
      Suspending an actor with an invalid name fails with INVALID_ARGUMENT and
      the error names the invalid field.

  - name: SuspendActor_WrongState
    resource: actors
    description: |
      Suspending a crashed actor fails with FAILED_PRECONDITION and leaves the
      actor unchanged.

  - name: PauseActor_NotFound
    resource: actors
    description: |
      Pausing an actor that doesn't exist fails with NOT_FOUND.

  - name: PauseActor_ValidationError
    resource: actors
    description: |
      Pausing an actor with an invalid name fails with INVALID_ARGUMENT and the
      error names the invalid field.

  - name: PauseActor_WrongState
    resource: actors
    description: |
      Pausing a suspended actor fails with FAILED_PRECONDITION and leaves the
      actor unchanged.

  - name: RevertActor_NotFound
    resource: actors
    description: |
      Reverting an actor that doesn't exist fails with NOT_FOUND.

  - name: RevertActor_ValidationError
    resource: actors
    description: |
      Reverting an actor with an invalid name fails with INVALID_ARGUMENT and
      the error names the invalid field.

  - name: RevertActor_WrongState
    resource: actors
    description: |
      Reverting a suspended actor fails with FAILED_PRECONDITION and leaves the
      actor unchanged.

  - name: MintActorJWT_NotFound
    resource: actors
    description: |
      Minting a JWT for an actor that doesn't exist fails with NOT_FOUND.

  - name: MintActorJWT_ValidationError
    resource: actors
    description: |
      Minting a JWT for an actor with an invalid name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: MintActorCertificate_ValidationError
    resource: actors
    description: |
      Minting a certificate for an actor with an invalid name fails with
      INVALID_ARGUMENT and the error names the invalid field.

  - name: MintAteomActorCertificate_NotFound
    resource: actors
    description: |
      Minting an ateom certificate, as a node's atelet, for an actor that
      doesn't exist fails with NOT_FOUND.

  - name: MintAteomActorCertificate_ValidationError
    resource: actors
    description: |
      Minting an ateom certificate, as a node's atelet, for an actor with an
      invalid name fails with INVALID_ARGUMENT and the error names the invalid
      field.

  - name: RequestActorSuspend_NotFound
    resource: actors
    description: |
      Requesting, as a node's atelet, the suspend of an actor that doesn't exist
      fails with NOT_FOUND.

  - name: RequestActorSuspend_ValidationError
    resource: actors
    description: |
      Requesting, as a node's atelet, the suspend of an actor with an invalid
      name fails with INVALID_ARGUMENT and the error names the invalid field.

